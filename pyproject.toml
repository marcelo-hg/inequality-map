[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inequality-map"
version = "0.1.0"
description = "Reproducible WID and World Bank research database"
requires-python = ">=3.12"
dependencies = ["duckdb==1.4.4", "pyarrow==23.0.1", "httpx==0.28.1", "PyYAML==6.0.3", "pycountry==24.6.1"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
equal-earth = "inequality_map.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inequality_map = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
